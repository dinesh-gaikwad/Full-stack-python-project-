{% extends 'shop/base.html' %}{% block content %}<h1>Products</h1><form><input name="q" value="{{q}}" placeholder="Search products"><select name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{c.slug}}">{{c.name}}</option>{% endfor %}</select><button>Search</button></form><div class="grid">{% for p in products %}<article><h2>{{p.name}}</h2><p>{{p.category}}</p><b>₹{{p.price}}</b><p>{{p.description|truncatechars:100}}</p><a class="btn" href="{% url 'product_detail' p.id %}">Details</a><a class="btn" href="{% url 'cart_add' p.id %}">Add to Cart</a></article>{empty}<p>No products found.</p>{% endfor %}</div>{% endblock %}
