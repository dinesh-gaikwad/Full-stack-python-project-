{% extends 'shop/base.html' %}{% block content %}<h1>Your Cart</h1>{% for p,q in rows %}<div class="row"><span>{{p.name}} × {{q}}</span><span>₹{{p.price}}</span><a href="{% url 'cart_remove' p.id %}">Remove</a></div>{empty}<p>Cart is empty.</p>{% endfor %}<h2>Total: ₹{{total}}</h2>{% if rows %}<a class="btn" href="{% url 'checkout' %}">Checkout</a>{% endif %}{% endblock %}
